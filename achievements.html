<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Phoenix | Achievements</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        background: #0a0000;
        font-family: 'Poppins', sans-serif;
        overflow-x: hidden;
        min-height: 100vh;
    }

    .bg-gradient {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 20% 50%, #3a0000, #0a0000);
        z-index: -2;
    }

    #particleCanvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #2a0000; }
    ::-webkit-scrollbar-thumb { background: #ff6a4b; border-radius: 12px; }

    /* ========== PAGE TRANSITION ========== */
    .transition-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, #ff6b4a, #3a0000);
        z-index: 9999;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.5s ease;
    }
    .transition-overlay.active { opacity: 1; }

    /* ========== TOP BAR ========== */
    .top-bar {
        position: relative;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(20px);
        z-index: 100;
        padding: 12px 50px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255,179,71,0.3);
    }

    .logo {
        font-family: 'Orbitron', sans-serif;
        font-size: 24px;
        font-weight: 800;
        background: linear-gradient(135deg, #fff1b5, #ffbc6e);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .back-home {
        background: rgba(255,179,71,0.15);
        padding: 6px 20px;
        border-radius: 40px;
        text-decoration: none;
        color: #ffb347;
        transition: 0.3s;
        border: 1px solid rgba(255,179,71,0.3);
        font-size: 14px;
    }
    .back-home:hover {
        background: #ffb347;
        color: #1a0000;
        transform: scale(1.02);
    }

    /* ========== GOLDEN LINE & HAMBURGER ========== */
    .golden-section {
        position: relative;
        background: transparent;
    }

    .golden-line {
        height: 1px;
        background: linear-gradient(90deg, transparent, #ffb347, #ff6b4a, #ffb347, transparent);
        margin: 0 50px;
        opacity: 0.6;
    }

    .hamburger-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 50px 0 50px;
    }

    .menu-icon {
        font-size: 26px;
        cursor: pointer;
        transition: 0.2s;
        background: rgba(255,179,71,0.15);
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        color: #ffb347;
        border: 1px solid rgba(255,179,71,0.3);
    }

    .menu-icon:hover {
        background: #ffb347;
        color: #2c0000;
        transform: rotate(90deg);
    }

    .page-indicator {
        font-family: 'Orbitron', sans-serif;
        font-size: 16px;
        font-weight: 600;
        background: linear-gradient(135deg, #fff1b5, #ffbc6e);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 2px;
    }

    /* ========== MAIN CONTAINER ========== */
    .container {
        position: relative;
        z-index: 5;
        padding-top: 30px;
        min-height: 100vh;
    }

    /* Hero Title */
    .hero {
        text-align: center;
        padding: 30px 20px 40px;
    }

    .hero h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: 48px;
        background: linear-gradient(135deg, #fff1b5, #ffbc6e, #ff6b4a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 4px;
    }

    .hero p {
        color: #ffb347;
        letter-spacing: 3px;
        font-size: 12px;
        margin-top: 10px;
    }

    /* Achievements Grid */
    .achievements-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px 40px 80px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 35px;
    }

    .achievement-card {
        width: 320px;
        background: rgba(255,255,255,0.03);
        backdrop-filter: blur(12px);
        border-radius: 25px;
        border: 1px solid rgba(255,179,71,0.2);
        overflow: hidden;
        transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        position: relative;
    }

    .achievement-card:hover {
        transform: translateY(-10px);
        border-color: rgba(255,179,71,0.5);
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    /* Category Ribbon */
    .category-ribbon {
        position: absolute;
        top: 15px;
        left: -35px;
        width: 120px;
        padding: 5px 0;
        text-align: center;
        font-size: 10px;
        font-weight: bold;
        transform: rotate(-45deg);
        color: #2c0000;
    }

    .achievement-icon {
        text-align: center;
        padding: 35px 20px 20px;
        font-size: 65px;
        background: linear-gradient(135deg, rgba(255,77,77,0.1), rgba(204,43,43,0.1));
    }

    .achievement-content {
        padding: 0 20px 25px;
        text-align: center;
    }

    .achievement-title {
        font-size: 18px;
        font-weight: 800;
        font-family: 'Orbitron', sans-serif;
        background: linear-gradient(135deg, #fff1b5, #ffbc6e);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        margin-bottom: 10px;
    }

    .achievement-desc {
        font-size: 12px;
        line-height: 1.5;
        color: #ccc;
        margin-bottom: 15px;
    }

    .achievement-date {
        display: inline-block;
        background: rgba(255,179,71,0.15);
        padding: 5px 15px;
        border-radius: 20px;
        font-size: 10px;
        color: #ffb347;
        border: 1px solid rgba(255,179,71,0.3);
    }

    .footer {
        text-align: center;
        padding: 30px;
        border-top: 1px solid rgba(255,179,71,0.2);
        background: rgba(0,0,0,0.3);
        position: relative;
        z-index: 5;
        color: #ffb347;
        font-size: 12px;
    }

    /* Loading State */
    .loading {
        text-align: center;
        padding: 60px;
        color: #ffb347;
        font-size: 18px;
    }

    /* Empty State */
    .empty-state {
        text-align: center;
        padding: 60px;
        color: #ffb347;
        font-size: 18px;
    }

    /* ========== SLIDER MENU ========== */
    .slider-menu {
        position: fixed;
        top: 0;
        left: -280px;
        width: 280px;
        height: 100%;
        background: linear-gradient(180deg, #1a0a0a, #2d0909);
        backdrop-filter: blur(20px);
        z-index: 1001;
        transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        padding: 30px 0;
        border-right: 2px solid #ffb347;
        box-shadow: 5px 0 30px rgba(0,0,0,0.5);
        display: flex;
        flex-direction: column;
    }

    .slider-menu.open { left: 0; }

    .menu-logo {
        text-align: center;
        padding: 25px 20px;
        border-bottom: 1px solid rgba(255,179,71,0.3);
        margin-bottom: 20px;
    }

    .menu-logo img {
        width: 70px;
        height: auto;
        margin-bottom: 10px;
    }

    .menu-logo h3 {
        font-family: 'Orbitron', sans-serif;
        font-size: 16px;
        background: linear-gradient(135deg, #fff1b5, #ffbc6e);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    .menu-items {
        flex: 1;
        padding: 0 20px;
    }

    .menu-item {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 12px 20px;
        margin: 5px 0;
        border-radius: 40px;
        cursor: pointer;
        transition: all 0.3s ease;
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        font-size: 15px;
    }

    .menu-item i {
        width: 24px;
        font-size: 16px;
        color: #ffb347;
        text-align: center;
    }

    .menu-item span { flex: 1; }
    .menu-item:hover {
        background: rgba(255,179,71,0.15);
        transform: translateX(5px);
    }

    .menu-footer {
        padding: 20px;
        border-top: 1px solid rgba(255,179,71,0.3);
        margin-top: auto;
    }

    .member-login-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 15px;
        background: linear-gradient(135deg, rgba(255,179,71,0.15), rgba(255,107,74,0.15));
        border: 1px solid rgba(255,179,71,0.4);
        border-radius: 40px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        width: 100%;
    }

    .member-login-btn i {
        font-size: 16px;
        color: #ffb347;
    }

    .member-login-btn span {
        font-size: 13px;
        font-weight: 500;
        color: #ffb347;
        flex: 1;
        text-align: left;
    }

    .member-login-btn:hover {
        background: linear-gradient(135deg, #ffb347, #ff6b4a);
        transform: translateX(5px);
    }

    .member-login-btn:hover i,
    .member-login-btn:hover span {
        color: #2c0000;
    }

    .menu-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(3px);
        z-index: 1000;
        display: none;
    }
    .menu-overlay.show { display: block; }
    body.menu-open { overflow: hidden; }

    @media (max-width: 768px) {
        .top-bar { padding: 10px 25px; }
        .golden-line { margin: 0 25px; }
        .hamburger-row { padding: 5px 25px 0 25px; }
        .container { padding-top: 20px; }
        .hero h1 { font-size: 32px; }
        .achievements-container { padding: 20px; }
        .achievement-card { width: 100%; max-width: 320px; }
    }
</style>
</head>
<body>

<!-- SLIDER MENU -->
<div class="slider-menu" id="sliderMenu">
    <div class="menu-logo">
        <img src="Assets/Glogo.png" alt="Team Phoenix" onerror="this.src='https://placehold.co/70x70/ff4444/white?text=PHX'">
        <h3>TEAM PHOENIX</h3>
    </div>
    <div class="menu-items">
        <a href="index.html" class="menu-item"><i class="fas fa-home"></i><span>HOME</span></a>
        <a href="team.html" class="menu-item"><i class="fas fa-users"></i><span>TEAM</span></a>
        <a href="projects.html" class="menu-item"><i class="fas fa-rocket"></i><span>PROJECTS</span></a>
        <a href="achievements.html" class="menu-item"><i class="fas fa-trophy"></i><span>ACHIEVEMENTS</span></a>
        <a href="contact.html" class="menu-item"><i class="fas fa-envelope"></i><span>CONTACT US</span></a>
    </div>
    <div class="menu-footer">
        <a href="admin.html" class="member-login-btn">
            <i class="fas fa-user-shield"></i>
            <span>ADMIN PANEL</span>
            <i class="fas fa-arrow-right" style="font-size: 11px; opacity: 0.7;"></i>
        </a>
    </div>
</div>
<div class="menu-overlay" id="menuOverlay"></div>

<!-- PAGE TRANSITION OVERLAY -->
<div class="transition-overlay" id="transitionOverlay"></div>

<!-- BACKGROUND -->
<div class="bg-gradient"></div>
<canvas id="particleCanvas"></canvas>

<!-- TOP BAR -->
<div class="top-bar">
    <div class="logo">🐦‍🔥 TEAM PHOENIX</div>
    <a href="index.html" class="back-home">← RETURN TO HOME</a>
</div>

<!-- GOLDEN LINE & HAMBURGER -->
<div class="golden-section">
    <div class="golden-line"></div>
    <div class="hamburger-row">
        <div class="menu-icon" id="menuIcon">☰</div>
        <div class="page-indicator">✦ OUR ACHIEVEMENTS ✦</div>
    </div>
</div>

<!-- MAIN CONTENT -->
<div class="container">
    <div class="hero">
        <h1>🏆 OUR ACHIEVEMENTS</h1>
        <p>✦ MILESTONES THAT DEFINE OUR JOURNEY ✦</p>
    </div>

    <!-- Achievements Grid - Loaded from Firebase -->
    <div class="achievements-container" id="achievementsContainer">
        <div class="loading">🏆 Loading achievements...</div>
    </div>
</div>

<div class="footer">
    <p>✨ RISING FROM THE ASHES, ONE ACHIEVEMENT AT A TIME. ✨</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAeHLD5WT6lKFzvhk5rPiAycn8oHpP1l0I",
        authDomain: "team-phoenix-admin-f27e6.firebaseapp.com",
        projectId: "team-phoenix-admin-f27e6",
        storageBucket: "team-phoenix-admin-f27e6.firebasestorage.app",
        messagingSenderId: "604760212282",
        appId: "1:604760212282:web:616ff666222e41db900603"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ========== PARTICLE BACKGROUND ==========
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function createParticles() {
        particles = [];
        for (let i = 0; i < 80; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 3 + 1,
                speedX: (Math.random() - 0.5) * 0.5,
                speedY: (Math.random() - 0.5) * 0.3,
                color: `rgba(255, ${Math.random() * 100 + 50}, 50, ${Math.random() * 0.3 + 0.1})`
            });
        }
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            p.x += p.speedX;
            p.y += p.speedY;
            if (p.x < 0) p.x = canvas.width;
            if (p.x > canvas.width) p.x = 0;
            if (p.y < 0) p.y = canvas.height;
            if (p.y > canvas.height) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
        });
        requestAnimationFrame(animateParticles);
    }

    window.addEventListener('resize', () => {
        resizeCanvas();
        createParticles();
    });
    resizeCanvas();
    createParticles();
    animateParticles();

    // ========== SLIDER MENU ==========
    const menuIcon = document.getElementById('menuIcon');
    const sliderMenu = document.getElementById('sliderMenu');
    const menuOverlay = document.getElementById('menuOverlay');

    function openMenu() {
        sliderMenu.classList.add('open');
        menuOverlay.classList.add('show');
        document.body.classList.add('menu-open');
    }

    function closeMenu() {
        sliderMenu.classList.remove('open');
        menuOverlay.classList.remove('show');
        document.body.classList.remove('menu-open');
    }

    if (menuIcon) {
        menuIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            if (sliderMenu.classList.contains('open')) {
                closeMenu();
            } else {
                openMenu();
            }
        });
    }

    if (menuOverlay) {
        menuOverlay.addEventListener('click', closeMenu);
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sliderMenu && sliderMenu.classList.contains('open')) {
            closeMenu();
        }
    });

    // ========== LOAD ACHIEVEMENTS FROM FIREBASE ==========
    function getCategoryColor(category) {
        switch(category) {
            case 'hackathon': return '#ffb347';
            case 'award': return '#2196f3';
            case 'certification': return '#4caf50';
            case 'milestone': return '#ff9800';
            default: return '#ffb347';
        }
    }

    function getCategoryDisplay(category) {
        switch(category) {
            case 'hackathon': return 'HACKATHON';
            case 'award': return 'AWARD';
            case 'certification': return 'CERTIFICATION';
            case 'milestone': return 'MILESTONE';
            default: return 'ACHIEVEMENT';
        }
    }

    async function loadAchievements() {
        const container = document.getElementById('achievementsContainer');
        try {
            const querySnapshot = await getDocs(collection(db, 'achievements'));
            const achievements = [];
            querySnapshot.forEach(doc => {
                achievements.push({ id: doc.id, ...doc.data() });
            });

            if (achievements.length === 0) {
                container.innerHTML = '<div class="empty-state">🏆 No achievements yet. Check back soon!</div>';
                return;
            }

            container.innerHTML = achievements.map(ach => `
                <div class="achievement-card">
                    <div class="category-ribbon" style="background: ${getCategoryColor(ach.category)}">
                        ${getCategoryDisplay(ach.category)}
                    </div>
                    <div class="achievement-icon">${ach.icon || '🏆'}</div>
                    <div class="achievement-content">
                        <div class="achievement-title">${escapeHtml(ach.title)}</div>
                        <div class="achievement-desc">${escapeHtml(ach.desc)}</div>
                        <div class="achievement-date">📅 ${escapeHtml(ach.date) || 'No date'}</div>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            console.error("Error loading achievements:", error);
            container.innerHTML = '<div class="empty-state">❌ Error loading achievements. Please try again later.</div>';
        }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Load achievements when page loads
    loadAchievements();

    // ========== PAGE TRANSITION ==========
    const transitionOverlay = document.getElementById('transitionOverlay');

    function navigateToPage(url) {
        transitionOverlay.classList.add('active');
        setTimeout(() => {
            window.location.href = url;
        }, 500);
    }

    const navLinks = document.querySelectorAll('.menu-item');
    navLinks.forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            const href = link.getAttribute('href');
            if (href && href !== '#') {
                navigateToPage(href);
            }
        });
    });

    window.addEventListener('load', () => {
        setTimeout(() => {
            transitionOverlay.classList.remove('active');
        }, 100);
    });
</script>

</body>
</html>
